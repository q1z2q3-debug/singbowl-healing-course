  </g>
  <text x="48" y="96" font-size="30" fill="#241d38" font-weight="600" text-anchor="start" font-family="'Noto Serif CJK SC','Source Han Serif SC','Noto Serif SC','Songti SC','SimSun',serif"><tspan x="48" dy="0">敲击</tspan></text>
  <line x1="48" y1="114" x2="912" y2="114" stroke="#7253ed" stroke-width="2" opacity="0.35"/>
<line x1="60" y1="300" x2="900" y2="300" stroke="#7253ed" stroke-width="3" opacity="0.25"/>
<circle cx="149.2" cy="300" r="26" fill="#7253ed"/>
<text x="149.2" y="307" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">1</text>
<rect x="48.0" y="350" width="202.5" height="120" rx="10" fill="#fff" stroke="#7253ed" stroke-opacity="0.2"/>
<text x="149.25" y="380.0" font-size="16" fill="#332b45" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><tspan x="149.25" dy="0">（震感+频率+振幅） </tspan><tspan x="149.25" dy="24">通过检测颂钵的音调，通</tspan><tspan x="149.25" dy="24">过敲击力度感知和检测音</tspan><tspan x="149.25" dy="24">…</tspan></text>
<circle cx="369.8" cy="300" r="26" fill="#c9a227"/>
<text x="369.8" y="307" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">2</text>
<rect x="268.5" y="350" width="202.5" height="120" rx="10" fill="#fff" stroke="#7253ed" stroke-opacity="0.2"/>
<text x="369.75" y="392.0" font-size="16" fill="#332b45" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><tspan x="369.75" dy="0">通过震感、声音的持续性</tspan><tspan x="369.75" dy="24">、振动的持续性进行感知</tspan><tspan x="369.75" dy="24">判别</tspan></text>
<circle cx="590.2" cy="300" r="26" fill="#7253ed"/>
<text x="590.2" y="307" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">3</text>
<rect x="489.0" y="350" width="202.5" height="120" rx="10" fill="#fff" stroke="#7253ed" stroke-opacity="0.2"/>
<text x="590.25" y="380.0" font-size="16" fill="#332b45" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><tspan x="590.25" dy="0">1/4敲击，将钵分为四</tspan><tspan x="590.25" dy="24">个方位，在定点的四个方</tspan><tspan x="590.25" dy="24">位敲击，感知均衡与稳定</tspan><tspan x="590.25" dy="24">…</tspan></text>
<circle cx="810.8" cy="300" r="26" fill="#c9a227"/>
<text x="810.8" y="307" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">4</text>
<rect x="709.5" y="350" width="202.5" height="120" rx="10" fill="#fff" stroke="#7253ed" stroke-opacity="0.2"/>
<text x="810.75" y="380.0" font-size="16" fill="#332b45" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><tspan x="810.75" dy="0">1/8敲击，是将钵分为</tspan><tspan x="810.75" dy="24">八个区域，在每一块区域</tspan><tspan x="810.75" dy="24">内敲击，感知钵在不同区</tspan><tspan x="810.75" dy="24">…</tspan></text>
