  <text x="48" y="50" font-size="15" fill="#7253ed" letter-spacing="2" font-family="'Noto Serif CJK SC','Source Han Serif SC','Noto Serif SC','Songti SC','SimSun',serif">第一章</text>
  <g>
    <rect x="792" y="30" width="120" height="34" rx="17" fill="#efe9ff" stroke="#c9a227" stroke-width="1.5"/>
