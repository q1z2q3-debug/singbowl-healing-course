<text x="656.4000000000001" y="380.0" font-size="16" fill="#332b45" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><tspan x="656.4000000000001" dy="0">颂钵疗愈后的反应</tspan><tspan x="656.4000000000001" dy="24">： 正常反应&amp;异</tspan><tspan x="656.4000000000001" dy="24">常反应 不好奇、</tspan><tspan x="656.4000000000001" dy="24">不追求、不害怕 </tspan></text>
