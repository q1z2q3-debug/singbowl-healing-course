<rect x="48.0" y="350" width="158.4" height="120" rx="10" fill="#fff" stroke="#5b6abf" stroke-opacity="0.2"/>
<text x="127.2" y="380.0" font-size="16" fill="#332b45" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><tspan x="127.2" dy="0">放松、接受、安静</tspan><tspan x="127.2" dy="24">、平和、好奇心、</tspan><tspan x="127.2" dy="24">自在、喜悦 注意</tspan><tspan x="127.2" dy="24">事项： 饮食调整</tspan></text>
