  </g>
  <text x="48" y="96" font-size="30" fill="#241d38" font-weight="600" text-anchor="start" font-family="'Noto Serif CJK SC','Source Han Serif SC','Noto Serif SC','Songti SC','SimSun',serif"><tspan x="48" dy="0">生命｜像素</tspan></text>
  <line x1="48" y1="114" x2="912" y2="114" stroke="#5b6abf" stroke-width="2" opacity="0.35"/>
<line x1="70" y1="320" x2="890" y2="320" stroke="#5b6abf" stroke-width="3" opacity="0.35"/>
<circle cx="110.0" cy="320" r="13" fill="#5b6abf" stroke="#fff" stroke-width="3"/>
<text x="110.0" y="292" font-size="16" fill="#5b6abf" text-anchor="middle" font-weight="700">1942</text>
<text x="110.0" y="250" font-size="14" fill="#4a405e" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><tspan x="110.0" dy="0">第二节 世界观 爱因</tspan><tspan x="110.0" dy="19">斯坦：《我的世界观》</tspan></text>
<circle cx="295.0" cy="320" r="13" fill="#c9a227" stroke="#fff" stroke-width="3"/>
<text x="295.0" y="362" font-size="16" fill="#5b6abf" text-anchor="middle" font-weight="700">1950</text>
<text x="295.0" y="398" font-size="14" fill="#4a405e" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><tspan x="295.0" dy="0">我们每个人在这个世界</tspan><tspan x="295.0" dy="19">上都只作一个短暂的逗</tspan></text>
<circle cx="480.0" cy="320" r="13" fill="#5b6abf" stroke="#fff" stroke-width="3"/>
<text x="480.0" y="292" font-size="16" fill="#5b6abf" text-anchor="middle" font-weight="700">1918</text>
<text x="480.0" y="250" font-size="14" fill="#4a405e" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><tspan x="480.0" dy="0">目的何在，却无所知，</tspan><tspan x="480.0" dy="19">尽管有时自以为对此若</tspan></text>
<circle cx="665.0" cy="320" r="13" fill="#c9a227" stroke="#fff" stroke-width="3"/>
<text x="665.0" y="362" font-size="16" fill="#5b6abf" text-anchor="middle" font-weight="700">1933</text>
<text x="665.0" y="398" font-size="14" fill="#4a405e" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><tspan x="665.0" dy="0">但是，不必深思，只要</tspan><tspan x="665.0" dy="19">从日常生活就可以明白</tspan></text>
<circle cx="850.0" cy="320" r="13" fill="#5b6abf" stroke="#fff" stroke-width="3"/>
<text x="850.0" y="292" font-size="16" fill="#5b6abf" text-anchor="middle" font-weight="700">1930</text>
<text x="850.0" y="250" font-size="14" fill="#4a405e" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><tspan x="850.0" dy="0">然后是为许多我们所不</tspan><tspan x="850.0" dy="19">认识的人，他们的命运</tspan></text>
  <line x1="48" y1="500" x2="912" y2="500" stroke="#d8d0c4" stroke-width="1"/>
