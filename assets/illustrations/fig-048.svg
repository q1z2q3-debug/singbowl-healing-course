  <line x1="48" y1="114" x2="912" y2="114" stroke="#7253ed" stroke-width="2" opacity="0.35"/>
<line x1="60" y1="300" x2="900" y2="300" stroke="#7253ed" stroke-width="3" opacity="0.25"/>
<circle cx="127.2" cy="300" r="26" fill="#7253ed"/>
<text x="127.2" y="307" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">1</text>
<rect x="48.0" y="350" width="158.4" height="120" rx="10" fill="#fff" stroke="#7253ed" stroke-opacity="0.2"/>
<text x="127.2" y="380.0" font-size="16" fill="#332b45" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><tspan x="127.2" dy="0">心法：稳、静、柔</tspan><tspan x="127.2" dy="24">、气韵 平息凝神</tspan><tspan x="127.2" dy="24">，左手伸平，将钵</tspan><tspan x="127.2" dy="24">放于手掌中心，右</tspan></text>
<circle cx="303.6" cy="300" r="26" fill="#c9a227"/>
<text x="303.6" y="307" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">2</text>
<rect x="224.4" y="350" width="158.4" height="120" rx="10" fill="#fff" stroke="#7253ed" stroke-opacity="0.2"/>
<text x="303.6" y="380.0" font-size="16" fill="#332b45" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><tspan x="303.6" dy="0">由快而慢慢地颂钵</tspan><tspan x="303.6" dy="24">会随着木棒的摩擦</tspan><tspan x="303.6" dy="24">，产生振动发出悦</tspan><tspan x="303.6" dy="24">耳的共振之声，声</tspan></text>
<circle cx="480.0" cy="300" r="26" fill="#7253ed"/>
<text x="480.0" y="307" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">3</text>
<rect x="400.8" y="350" width="158.4" height="120" rx="10" fill="#fff" stroke="#7253ed" stroke-opacity="0.2"/>
<text x="480.0" y="380.0" font-size="16" fill="#332b45" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><tspan x="480.0" dy="0">磨钵技法2种 轻</tspan><tspan x="480.0" dy="24">触+手握 不要动</tspan><tspan x="480.0" dy="24">用手腕，而是应该</tspan><tspan x="480.0" dy="24">用手肘和肩膀的力</tspan></text>
<circle cx="656.4" cy="300" r="26" fill="#c9a227"/>
<text x="656.4" y="307" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">4</text>
<rect x="577.2" y="350" width="158.4" height="120" rx="10" fill="#fff" stroke="#7253ed" stroke-opacity="0.2"/>
<text x="656.4000000000001" y="380.0" font-size="16" fill="#332b45" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><tspan x="656.4000000000001" dy="0">左右摩擦，来回摩</tspan><tspan x="656.4000000000001" dy="24">擦 磨钵就是在钵</tspan><tspan x="656.4000000000001" dy="24">口画圈，即是画圈</tspan><tspan x="656.4000000000001" dy="24">，可以忽快忽慢，</tspan></text>
<circle cx="832.8" cy="300" r="26" fill="#7253ed"/>
<text x="832.8" y="307" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">5</text>
<rect x="753.6" y="350" width="158.4" height="120" rx="10" fill="#fff" stroke="#7253ed" stroke-opacity="0.2"/>
<text x="832.8000000000001" y="380.0" font-size="16" fill="#332b45" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><tspan x="832.8000000000001" dy="0">关键点：起点即终</tspan><tspan x="832.8000000000001" dy="24">点 磨钵前，净手</tspan><tspan x="832.8000000000001" dy="24">、静心，净化颂钵</tspan><tspan x="832.8000000000001" dy="24">，准备疗愈的意图</tspan></text>
