<rect x="224.4" y="350" width="158.4" height="120" rx="10" fill="#fff" stroke="#5b6abf" stroke-opacity="0.2"/>
<text x="303.6" y="380.0" font-size="16" fill="#332b45" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><tspan x="303.6" dy="0">注意排空大小便 </tspan><tspan x="303.6" dy="24">在经月胎产期间，</tspan><tspan x="303.6" dy="24">不做意守丹田的操</tspan><tspan x="303.6" dy="24">作</tspan></text>
<circle cx="480.0" cy="300" r="26" fill="#5b6abf"/>
<text x="480.0" y="307" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">3</text>
<rect x="400.8" y="350" width="158.4" height="120" rx="10" fill="#fff" stroke="#5b6abf" stroke-opacity="0.2"/>
<text x="480.0" y="380.0" font-size="16" fill="#332b45" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><tspan x="480.0" dy="0">不做打的腹式呼吸</tspan><tspan x="480.0" dy="24">或者是大的肢体活</tspan><tspan x="480.0" dy="24">动，避免气血过度</tspan><tspan x="480.0" dy="24">下行</tspan></text>
