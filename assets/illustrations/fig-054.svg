<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#d9d1c4"/>
    </pattern>
  </defs>
  <rect width="960" height="540" fill="#fdfaf3"/>
  <rect width="960" height="540" fill="url(#dots)" opacity="0.7"/>
  <path d="M0 0 H960 V8 H0 Z" fill="#7253ed"/>
  <text x="48" y="50" font-size="15" fill="#7253ed" letter-spacing="2" font-family="'Noto Serif CJK SC','Source Han Serif SC','Noto Serif SC','Songti SC','SimSun',serif">第一章</text>
  <g>
    <rect x="792" y="30" width="120" height="34" rx="17" fill="#efe9ff" stroke="#c9a227" stroke-width="1.5"/>
    <text x="852" y="52" font-size="15" fill="#7253ed" text-anchor="middle" font-family="'Noto Serif CJK SC','Source Han Serif SC','Noto Serif SC','Songti SC','SimSun',serif">图 1-52</text>
  </g>
  <text x="48" y="96" font-size="30" fill="#241d38" font-weight="600" text-anchor="start" font-family="'Noto Serif CJK SC','Source Han Serif SC','Noto Serif SC','Songti SC','SimSun',serif"><tspan x="48" dy="0">丁夏使用技法及场合</tspan></text>
  <line x1="48" y1="114" x2="912" y2="114" stroke="#7253ed" stroke-width="2" opacity="0.35"/>
<line x1="60" y1="300" x2="900" y2="300" stroke="#7253ed" stroke-width="3" opacity="0.25"/>
<circle cx="127.2" cy="300" r="26" fill="#7253ed"/>
<text x="127.2" y="307" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">1</text>
<rect x="48.0" y="350" width="158.4" height="120" rx="10" fill="#fff" stroke="#7253ed" stroke-opacity="0.2"/>
<text x="127.2" y="380.0" font-size="16" fill="#332b45" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><tspan x="127.2" dy="0">藏语称为丁夏，华</tspan><tspan x="127.2" dy="24">语世界中亦有因其</tspan><tspan x="127.2" dy="24">使用方法而称之为</tspan><tspan x="127.2" dy="24">撞铃、碰铃，既是</tspan></text>
<circle cx="303.6" cy="300" r="26" fill="#c9a227"/>
<text x="303.6" y="307" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">2</text>
<rect x="224.4" y="350" width="158.4" height="120" rx="10" fill="#fff" stroke="#7253ed" stroke-opacity="0.2"/>
<text x="303.6" y="380.0" font-size="16" fill="#332b45" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><tspan x="303.6" dy="0">丁夏由两个铃铛互</tspan><tspan x="303.6" dy="24">相串联而成，铃与</tspan><tspan x="303.6" dy="24">铃互相碰撞后产生</tspan><tspan x="303.6" dy="24">高亢嘹亮，空灵悦</tspan></text>
<circle cx="480.0" cy="300" r="26" fill="#7253ed"/>
<text x="480.0" y="307" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">3</text>
<rect x="400.8" y="350" width="158.4" height="120" rx="10" fill="#fff" stroke="#7253ed" stroke-opacity="0.2"/>
<text x="480.0" y="380.0" font-size="16" fill="#332b45" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><tspan x="480.0" dy="0">丁夏历史久远，用</tspan><tspan x="480.0" dy="24">法也多变，早期常</tspan><tspan x="480.0" dy="24">见于宗教仪式，同</tspan><tspan x="480.0" dy="24">时流行于不同民族</tspan></text>
<circle cx="656.4" cy="300" r="26" fill="#c9a227"/>
<text x="656.4" y="307" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">4</text>
<rect x="577.2" y="350" width="158.4" height="120" rx="10" fill="#fff" stroke="#7253ed" stroke-opacity="0.2"/>
<text x="656.4000000000001" y="380.0" font-size="16" fill="#332b45" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><tspan x="656.4000000000001" dy="0">到了近代，由于丁</tspan><tspan x="656.4000000000001" dy="24">夏小巧易携带，因</tspan><tspan x="656.4000000000001" dy="24">此成了修行人士常</tspan><tspan x="656.4000000000001" dy="24">用的随身禅修工具</tspan></text>
<circle cx="832.8" cy="300" r="26" fill="#7253ed"/>
<text x="832.8" y="307" font-size="19" fill="#fff" text-anchor="middle" font-weight="700">5</text>
<rect x="753.6" y="350" width="158.4" height="120" rx="10" fill="#fff" stroke="#7253ed" stroke-opacity="0.2"/>
<text x="832.8000000000001" y="380.0" font-size="16" fill="#332b45" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK SC','Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif"><tspan x="832.8000000000001" dy="0">传统上，丁夏发出</tspan><tspan x="832.8000000000001" dy="24">的音乐可以清除一</tspan><tspan x="832.8000000000001" dy="24">个空间的负面能量</tspan><tspan x="832.8000000000001" dy="24">，使心灵回到当下</tspan></text>
  <line x1="48" y1="500" x2="912" y2="500" stroke="#d8d0c4" stroke-width="1"/>
  <text x="48" y="522" font-size="13" fill="#8a8072" font-family="'Noto Sans CJK SC','Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">简念颂钵音疗中心 · 颂钵疗愈师培训教材</text>
  <text x="912" y="522" font-size="12" fill="#a89f92" text-anchor="end" font-family="'Noto Sans CJK SC','Source Han Sans SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif">知识图解 · SVG</text>
</svg>